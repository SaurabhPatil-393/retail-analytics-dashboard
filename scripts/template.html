<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Retail Analytics — Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>__CHARTJS_INLINE__</script>
<style>
:root{
  --bg: #0E1217;
  --bg-elev: #151B22;
  --bg-elev-2: #1B222B;
  --line: #262F3A;
  --line-soft: #1E2630;
  --text: #E7EAEE;
  --text-mid: #9AA5B1;
  --text-dim: #62707D;
  --teal: #4FD1C5;
  --teal-dim: rgba(79,209,197,0.14);
  --amber: #F0A857;
  --amber-dim: rgba(240,168,87,0.14);
  --red: #E5626B;
  --red-dim: rgba(229,98,107,0.14);
  --green: #6FCF97;
  --violet: #9B8CF2;
  --radius: 3px;
  --font-head: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:var(--font-head); font-size:14px; -webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
::selection{background:var(--teal); color:#04211F;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:var(--bg-elev);}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#33404D;}

.num, .mono{font-family:var(--font-mono);}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(14,18,23,0.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 22px 0 22px;
}
.topbar-row1{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:12px;}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand .mark{width:9px; height:9px; background:var(--teal); display:inline-block; border-radius:1px; box-shadow:0 0 10px var(--teal);}
.brand h1{font-size:17px; font-weight:600; letter-spacing:0.01em;}
.brand .sub{color:var(--text-dim); font-size:12px; font-family:var(--font-mono);}
.refresh-tag{font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid); display:flex; align-items:center; gap:8px;}
.refresh-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green); box-shadow:0 0 6px var(--green);}

.tabs{display:flex; gap:2px; overflow-x:auto; padding-bottom:0;}
.tab{
  font-family:var(--font-mono); font-size:12px; color:var(--text-mid);
  padding:9px 16px; cursor:pointer; white-space:nowrap;
  border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--teal); border-bottom-color:var(--teal);}

/* ---------- filter bar ---------- */
.filterbar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:12px 22px; background:var(--bg-elev); border-bottom:1px solid var(--line);
}
.filterbar .flabel{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-right:2px;}
select, input[type=date], input[type=text]{
  background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);
  border-radius:var(--radius); padding:6px 9px; font-family:var(--font-mono); font-size:12px;
  outline:none;
}
select:focus, input:focus{border-color:var(--teal);}
.filter-reset{
  font-family:var(--font-mono); font-size:11.5px; color:var(--amber); cursor:pointer;
  padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius); background:transparent;
}
.filter-reset:hover{border-color:var(--amber);}
.filter-count{font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid); margin-left:auto;}
.filter-count b{color:var(--teal);}

/* ---------- layout ---------- */
main{padding:22px; max-width:1520px; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  font-size:11px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em;
  color:var(--text-dim); margin:26px 0 12px 0; display:flex; align-items:center; gap:10px;
}
.section-title:first-child{margin-top:0;}
.section-title::after{content:''; flex:1; height:1px; background:var(--line);}

.grid{display:grid; gap:12px;}
.g-kpi{grid-template-columns:repeat(auto-fit, minmax(168px,1fr));}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:1fr 1fr 1fr;}
.g-2-1{grid-template-columns:2fr 1fr;}
.g-1-2{grid-template-columns:1fr 2fr;}
@media(max-width:900px){.g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr;}}

.card{
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px;
}
.card h3{font-size:12.5px; font-weight:600; margin-bottom:2px;}
.card .desc{font-size:11.5px; color:var(--text-dim); margin-bottom:12px;}
.chart-wrap{position:relative; height:260px;}
.chart-wrap.short{height:190px;}
.chart-wrap.tall{height:340px;}

/* KPI cards */
.kpi{
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; position:relative; overflow:hidden;
}
.kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--teal);}
.kpi.neg::before{background:var(--red);}
.kpi .klabel{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;}
.kpi .kval{font-family:var(--font-mono); font-size:24px; font-weight:600; letter-spacing:-0.01em;}
.kpi .ksub{font-size:11.5px; color:var(--text-mid); margin-top:5px;}
.kpi .ksub.pos{color:var(--green);}
.kpi .ksub.neg{color:var(--red);}

/* legend chips */
.legend-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11.5px; color:var(--text-mid);}
.legend-row span{display:inline-flex; align-items:center; gap:6px;}
.legend-row i{width:9px; height:9px; border-radius:2px; display:inline-block;}

/* table */
.table-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
.table-toolbar input[type=text]{width:240px;}
.btn{
  font-family:var(--font-mono); font-size:11.5px; color:var(--text); background:var(--bg-elev-2);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 12px; cursor:pointer;
}
.btn:hover{border-color:var(--teal); color:var(--teal);}
.btn.primary{background:var(--teal-dim); color:var(--teal); border-color:var(--teal);}
.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius);}
table.data{width:100%; border-collapse:collapse; font-size:12px;}
table.data thead th{
  position:sticky; top:0; background:var(--bg-elev-2); text-align:left; padding:9px 12px;
  font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--text-mid); border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; user-select:none;
}
table.data thead th:hover{color:var(--teal);}
table.data thead th .arrow{opacity:.5; margin-left:4px;}
table.data tbody td{padding:8px 12px; border-bottom:1px solid var(--line-soft); font-family:var(--font-mono); white-space:nowrap; color:var(--text);}
table.data tbody tr:hover{background:var(--bg-elev-2);}
.status-pill{padding:2px 8px; border-radius:10px; font-size:10.5px; font-family:var(--font-mono);}
.status-Delivered{background:var(--teal-dim); color:var(--teal);}
.status-Shipped{background:rgba(155,140,242,.14); color:var(--violet);}
.status-Processing{background:var(--amber-dim); color:var(--amber);}
.status-Cancelled{background:var(--red-dim); color:var(--red);}
.status-Returned{background:var(--red-dim); color:var(--red);}
.pager{display:flex; align-items:center; gap:10px; margin-top:12px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid);}
.pager button{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text); border-radius:var(--radius); padding:5px 10px; cursor:pointer; font-family:var(--font-mono);}
.pager button:disabled{opacity:.35; cursor:not-allowed;}

/* insights */
.insight-card{
  background:var(--bg-elev); border:1px solid var(--line); border-left:2px solid var(--teal);
  border-radius:var(--radius); padding:14px 16px; font-size:13px; line-height:1.55; color:var(--text);
}
.insight-num{font-family:var(--font-mono); color:var(--teal); font-size:11px; margin-right:8px;}

/* quality bars */
.qbar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px;}
.qbar-label{width:190px; color:var(--text-mid); flex-shrink:0;}
.qbar-track{flex:1; height:8px; background:var(--bg-elev-2); border-radius:4px; overflow:hidden;}
.qbar-fill{height:100%; background:var(--teal);}
.qbar-val{width:70px; text-align:right; font-family:var(--font-mono); color:var(--text); flex-shrink:0;}

/* corr matrix */
.corr-table{width:100%; border-collapse:collapse; font-size:11px; font-family:var(--font-mono);}
.corr-table td, .corr-table th{padding:7px 8px; text-align:center; border:1px solid var(--line-soft);}
.corr-table th{color:var(--text-mid); font-weight:500;}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-dim); font-family:var(--font-mono); font-size:12.5px;}

footer{padding:24px 22px 40px; text-align:center; color:var(--text-dim); font-size:11.5px; font-family:var(--font-mono);}

.badge{display:inline-block; font-family:var(--font-mono); font-size:10px; padding:2px 7px; border-radius:9px; background:var(--amber-dim); color:var(--amber); margin-left:8px; vertical-align:middle;}

/* filter chips */
.chip-row{display:flex; flex-wrap:wrap; gap:6px; padding:10px 22px; background:var(--bg-elev-2); border-bottom:1px solid var(--line); font-family:var(--font-mono); font-size:11px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:3px 6px 3px 10px; color:var(--text-mid);}
.chip b{color:var(--teal); font-weight:500;}
.chip .x{cursor:pointer; color:var(--text-dim); background:var(--bg-elev-2); border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center; font-size:10px;}
.chip .x:hover{color:var(--red); background:var(--red-dim);}
.chip-empty{color:var(--text-dim); font-size:11px;}

/* toggle group (metric/granularity/comparison pickers) */
.toggle-group{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.toggle-group button{
  font-family:var(--font-mono); font-size:11px; color:var(--text-mid); background:var(--bg-elev-2);
  border:none; border-right:1px solid var(--line); padding:6px 11px; cursor:pointer;
}
.toggle-group button:last-child{border-right:none;}
.toggle-group button.active{background:var(--teal-dim); color:var(--teal);}
.toggle-row{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.toggle-row .tlabel{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}

/* KPI trend */
.kpi .ktrend{display:flex; align-items:center; gap:6px; margin-top:6px;}
.kpi .ktrend .arrow{font-size:11px;}
.kpi .kspark{margin-top:8px; height:28px;}
.kpi .kcompare{font-size:10.5px; color:var(--text-dim); margin-top:3px;}

/* breadcrumb (drill-down) */
.breadcrumb{display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid); margin-bottom:10px;}
.breadcrumb .crumb{cursor:pointer; color:var(--teal);}
.breadcrumb .crumb:hover{text-decoration:underline;}
.breadcrumb .sep{color:var(--text-dim);}
.drill-hint{font-size:10.5px; color:var(--text-dim); font-style:italic; margin-top:4px;}

/* heatmap */
.heatmap{border-collapse:collapse; font-size:11px; font-family:var(--font-mono); width:100%;}
.heatmap th{padding:6px 8px; color:var(--text-mid); font-weight:500; text-align:center;}
.heatmap th.rowhead{text-align:left; color:var(--text);}
.heatmap td{padding:6px 8px; text-align:center; color:#0A0F14; font-weight:600; border:1px solid var(--bg);}
.heatmap td.rowhead{text-align:left; color:var(--text-mid); font-weight:400; background:transparent;}
.heatmap td.empty{background:var(--bg-elev-2); color:var(--text-dim); font-weight:400;}

/* RFM segment badges */
.seg-chip{display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-family:var(--font-mono); font-weight:500;}
.seg-Champions{background:rgba(111,207,151,.18); color:var(--green);}
.seg-Loyal-Customers{background:var(--teal-dim); color:var(--teal);}
.seg-Potential-Loyalists{background:rgba(155,140,242,.16); color:var(--violet);}
.seg-New-Customers{background:rgba(91,155,213,.18); color:#5B9BD5;}
.seg-At-Risk{background:var(--amber-dim); color:var(--amber);}
.seg-Lost-Customers{background:var(--red-dim); color:var(--red);}
.seg-Needs-Attention{background:var(--bg-elev-2); color:var(--text-mid);}

.insight-cat{display:inline-block; font-size:10.5px; font-family:var(--font-mono); color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
.metric-support{font-family:var(--font-mono); color:var(--teal); font-size:12px;}

.col-toggle-menu{position:relative; display:inline-block;}
.col-toggle-panel{position:absolute; top:100%; right:0; z-index:20; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:var(--radius); padding:8px; margin-top:4px; display:none; min-width:170px;}
.col-toggle-panel.open{display:block;}
.col-toggle-panel label{display:flex; align-items:center; gap:6px; padding:4px 2px; font-size:11.5px; color:var(--text); cursor:pointer;}

.not-avail{color:var(--text-dim); font-style:italic;}
.reconcile-ok{color:var(--green); font-family:var(--font-mono); font-size:11px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div class="brand">
      <span class="mark"></span>
      <h1>Global Retail Analytics</h1>
      <span class="sub">command deck / FY22–FY25</span>
    </div>
    <div class="refresh-tag"><span class="dot"></span><span id="refreshTxt">last refresh —</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="filterbar" id="filterbar"></div>
<div class="chip-row" id="chipRow"></div>

<main id="main"></main>

<footer>Synthetic dataset generated for demonstration purposes · 24,288 raw records · client-side aggregation, no server round-trips</footer>

<script>
const DATA = __DATA_JSON__;
</script>
<script src="app.js"></script>
</body>
</html>
